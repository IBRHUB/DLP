<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DLP Downloads</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --bg: #0d1117;
      --surface: #151b23;
      --text-primary: #f2f7ff;
      --text-secondary: #b7c5d8;
      --border: #314155;
      --border-strong: #496178;
      --accent: #6f8aa8;
      --accent-active: #2f81f7;
      --accent-interactive: #58a6ff;
      --success: #44d17d;
      --error: #ff7b86;
      --surface-muted: #151b23;
      --ink: var(--text-primary);
      --muted: var(--text-secondary);
      --topbar-height: 86px;
      --preview-max-height: calc(100vh - 96px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100% - clamp(28px, 4vw, 48px), 1560px);
      height: 100vh;
      max-width: 1560px;
      margin: 0 auto;
      padding: clamp(var(--space-4), 2vw, var(--space-5)) 0;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      gap: var(--space-3);
      padding-bottom: var(--space-4);
      background: var(--bg);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .dashboard-tools {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: var(--space-2);
      align-items: center;
      min-width: 0;
    }

    .search-control,
    .sort-control {
      min-width: 0;
    }

    .search-control input,
    .sort-control select {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-primary);
      font: 500 13px "Segoe UI", Arial, sans-serif;
      padding: 0 11px;
      outline: none;
    }

    .search-control input::placeholder {
      color: color-mix(in srgb, var(--text-secondary) 88%, var(--text-primary));
    }

    .search-control input:hover,
    .search-control input:focus,
    .sort-control select:hover,
    .sort-control select:focus {
      border-color: var(--accent-interactive);
    }

    .filter-group {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      padding: 2px;
    }

    .filter-button {
      height: 28px;
      border-color: transparent;
      padding: 0 10px;
      font-size: 12px;
      background: transparent;
      color: var(--text-secondary);
    }

    .filter-button:hover {
      border-color: transparent;
      color: var(--accent-interactive);
    }

    .filter-button.is-active {
      background: color-mix(in srgb, var(--accent-interactive) 16%, var(--surface));
      color: var(--text-primary);
      border-color: color-mix(in srgb, var(--accent-interactive) 42%, transparent);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      min-height: 22px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
      border-radius: 999px;
      padding: 0 9px;
      background: color-mix(in srgb, var(--surface) 82%, var(--bg));
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .folder-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      flex-wrap: wrap;
      min-width: 0;
    }

    .folder-status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      max-width: 240px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 11px;
      color: var(--text-secondary);
      background: var(--surface);
      font-size: 12px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .folder-status[data-state="locked"] {
      color: var(--error);
      border-color: color-mix(in srgb, var(--error) 58%, var(--border));
    }

    .folder-status[data-state="unlocked"] {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 55%, var(--border));
    }

    button {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-primary);
      font: 650 13px "Segoe UI", Arial, sans-serif;
      padding: 0 13px;
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease;
    }

    button:hover {
      border-color: var(--accent-interactive);
      color: var(--accent-interactive);
    }

    button:disabled {
      cursor: default;
      color: var(--text-secondary);
      border-color: var(--border);
      background: var(--surface);
      opacity: 0.6;
    }

    button:focus-visible,
    .item:focus-visible {
      outline: 2px solid var(--accent-interactive);
      outline-offset: 2px;
    }

    .list {
      display: grid;
      height: 100%;
      gap: var(--space-2);
      align-content: start;
      min-width: 0;
      overflow: auto;
      padding-right: var(--space-1);
      scrollbar-color: transparent transparent;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      transition: scrollbar-color 160ms ease;
    }

    .list:hover,
    .list:focus-within {
      scrollbar-color: color-mix(in srgb, var(--border-strong) 85%, transparent) transparent;
    }

    .list::-webkit-scrollbar {
      width: 10px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 3px solid transparent;
      border-radius: 999px;
      background: transparent;
      background-clip: content-box;
      transition: background-color 160ms ease;
    }

    .list:hover::-webkit-scrollbar-thumb,
    .list:focus-within::-webkit-scrollbar-thumb {
      background-color: color-mix(in srgb, var(--border-strong) 85%, transparent);
    }

    .list::-webkit-scrollbar-thumb:hover {
      background-color: var(--accent);
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px;
      cursor: pointer;
      text-align: left;
      color: var(--text-primary);
      transition: border-color 150ms ease;
    }

    .item:hover {
      border-color: var(--accent);
    }

    .item.active {
      border-color: var(--accent-interactive);
      background: color-mix(in srgb, var(--accent-interactive) 10%, var(--surface));
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .title {
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }

    .file-badge {
      flex: 0 0 auto;
      min-width: 44px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
    }

    .file-badge[data-kind="video"] {
      color: var(--accent-interactive);
      border-color: color-mix(in srgb, var(--accent-interactive) 46%, var(--border));
    }

    .file-badge[data-kind="audio"] {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 42%, var(--border));
    }

    .meta {
      margin-top: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      padding: var(--space-5);
      color: var(--text-secondary);
      background: var(--surface);
    }

    .ok {
      color: var(--accent-interactive);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(248px, clamp(300px, 24vw, 340px)) minmax(0, 1fr);
      gap: var(--space-4);
      align-items: start;
      min-height: 0;
      padding-top: var(--space-4);
      overflow: hidden;
    }

    .viewer {
      display: grid;
      grid-template-rows: minmax(0, auto) auto;
      gap: var(--space-3);
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .viewer > * {
      justify-self: center;
    }

    .viewer-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      max-height: var(--preview-max-height);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000000;
      color: var(--text-secondary);
      font-size: 13px;
      overflow: hidden;
    }

    .viewer-frame::after {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      content: "";
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
      z-index: 2;
    }

    .viewer-frame.loading {
      border-color: var(--border);
      background: var(--surface);
    }

    .viewer-frame.loading::after {
      opacity: 1;
    }

    .viewer-message {
      padding: var(--space-4);
      text-align: center;
      color: var(--text-primary);
      line-height: 1.45;
      max-width: 42ch;
    }

    .viewer-message strong {
      display: block;
      margin-bottom: var(--space-1);
      font-size: 15px;
    }

    .viewer-message span {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .viewer-frame.empty,
    .viewer-frame.audio {
      width: min(100%, 680px);
      min-height: min(320px, var(--preview-max-height));
      aspect-ratio: auto;
      background: var(--surface);
    }

    .viewer-frame.landscape,
    .viewer-frame.ultrawide {
      width: 100%;
      aspect-ratio: var(--media-ratio, 16 / 9);
    }

    .viewer-frame.portrait {
      width: auto;
      height: min(var(--preview-max-height), 820px);
      max-width: min(100%, 760px);
      aspect-ratio: var(--media-ratio, 9 / 16);
      margin-left: auto;
      margin-right: auto;
    }

    .viewer-frame.tall {
      width: auto;
      height: min(var(--preview-max-height), 820px);
      max-width: min(100%, 500px);
      aspect-ratio: var(--media-ratio, 9 / 16);
      margin-left: auto;
      margin-right: auto;
    }

    .viewer-frame.square {
      width: min(100%, var(--preview-max-height), 760px);
      aspect-ratio: 1 / 1;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: minmax(236px, 300px) minmax(0, 1fr);
        gap: var(--space-3);
      }

      .viewer-frame.empty,
      .viewer-frame.audio {
        width: min(100%, 600px);
      }
    }

    .viewer-frame video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
      object-fit: contain;
      opacity: 1;
      transition: opacity 140ms ease;
    }

    .viewer-frame audio {
      width: 100%;
      max-width: 420px;
    }

    .viewer-frame video[hidden],
    .viewer-frame audio[hidden],
    .viewer-message[hidden] {
      display: none;
    }

    .viewer-play {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      z-index: 3;
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .viewer-play:disabled {
      visibility: hidden;
    }

    .viewer-frame.loading .viewer-play {
      visibility: hidden;
    }

    .details {
      width: min(100%, 680px);
      border-top: 1px solid var(--border);
      padding-top: var(--space-3);
    }

    .details[hidden] {
      display: none;
    }

    .details-title {
      margin: 0 0 var(--space-2);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2) var(--space-4);
      margin: 0;
    }

    .detail {
      min-width: 0;
    }

    .detail dt,
    .detail dd {
      margin: 0;
    }

    .detail dt {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 650;
    }

    .detail dd {
      margin-top: 2px;
      color: var(--text-primary);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 920px) {
      main {
        padding: var(--space-4) 0;
      }

      .topbar {
        padding-bottom: var(--space-3);
      }

      .layout {
        grid-template-areas:
          "viewer"
          "list";
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .list {
        grid-area: list;
        min-height: 0;
        overflow: auto;
        padding-right: 0;
      }

      .viewer {
        grid-area: viewer;
        height: auto;
        overflow: visible;
      }

      .dashboard-tools {
        grid-template-columns: 1fr;
      }

      .filter-group {
        width: 100%;
      }

      .filter-button {
        flex: 1;
      }

      .viewer-frame {
        --preview-max-height: 70vh;
      }

      .viewer-frame.empty,
      .viewer-frame.audio {
        width: 100%;
      }

      .details {
        width: 100%;
      }

      .viewer-play {
        top: var(--space-2);
        right: var(--space-2);
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 1560px);
        padding: var(--space-3) 0;
      }

      header {
        gap: var(--space-2);
      }

      h1 {
        font-size: 20px;
      }

      .folder-actions {
        justify-content: flex-start;
        width: 100%;
      }

      .folder-status {
        max-width: 100%;
      }

      .stats {
        gap: var(--space-1);
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      button {
        min-width: 44px;
      }

      .viewer-frame.empty,
      .viewer-frame.audio {
        min-height: min(280px, var(--preview-max-height));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .viewer-frame::after,
      .viewer-frame video {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <header>
        <h1>DLP Downloads</h1>
        <div class="folder-actions" aria-label="Download folder access">
          <span id="folderStatus" class="folder-status" data-state="unsupported">Checking</span>
          <button id="unlockFolder" type="button">Unlock & open</button>
          <button id="lockFolder" type="button">Lock now</button>
          <button id="refreshVideos" type="button">Refresh</button>
        </div>
      </header>
      <div class="dashboard-tools" aria-label="Download tools">
        <label class="search-control">
          <span class="sr-only">Search downloads</span>
          <input id="searchDownloads" type="search" placeholder="Search downloads" autocomplete="off">
        </label>
        <div class="filter-group" role="group" aria-label="Filter downloads">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="video" aria-pressed="false">Video</button>
          <button class="filter-button" type="button" data-filter="audio" aria-pressed="false">Audio</button>
        </div>
        <label class="sort-control">
          <span class="sr-only">Sort downloads</span>
          <select id="sortDownloads">
            <option value="recent">Recent first</option>
            <option value="name">Name</option>
            <option value="size">Largest first</option>
            <option value="type">Type</option>
          </select>
        </label>
      </div>
      <div class="stats" aria-label="Download summary">
        <span id="statCount" class="stat">0 files</span>
        <span id="statVisible" class="stat">0 shown</span>
        <span id="statSize" class="stat">0 KB</span>
      </div>
    </div>

    <div class="layout">
      <section id="videos" class="list" aria-label="Downloaded files"></section>

      <section class="viewer" aria-label="Selected download">
        <div id="viewerFrame" class="viewer-frame empty">
          <div id="viewerMessage" class="viewer-message">
            <strong>Select a file</strong>
            <span>Choose a download from the list</span>
          </div>
          <button id="viewerPlay" class="viewer-play" type="button" disabled>Open</button>
        </div>
        <div id="fileDetails" class="details" hidden>
          <h2 id="detailsTitle" class="details-title"></h2>
          <dl id="detailsGrid" class="details-grid"></dl>
        </div>
      </section>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
